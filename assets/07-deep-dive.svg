<text x="680.5" y="285.45" font-family='-apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif' font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">打包复制追问到剪贴板</text>
