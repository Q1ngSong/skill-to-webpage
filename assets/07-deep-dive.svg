<text x="41" y="128" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l1" opacity="0">- Skill:find-skills(源目录:&lt;skill 目录&gt;)</text>
<text x="41" y="146" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l2" opacity="0">- 提问对象:n03「How to Help Users Find Skills」 &gt; 「Step 3 CLI 搜索」</text>
<text x="41" y="164" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l3" opacity="0">- 原文位置:&lt;skill 目录&gt;/SKILL.md 的 第 51-64 行</text>
<text x="41" y="182" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l4" opacity="0">- 涉及依赖文件:</text>
<text x="41" y="200" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l5" opacity="0">  - (该内容块未显式引用依赖文件)</text>
<text x="41" y="218" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l6" opacity="0">- 知识库:&lt;output&gt;/find-skills/static/(full_text.md 行号与原文位置一致,节点摘要在 nodes/)</text>
<text x="41" y="236" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#5b5f6b" font-weight="500" class="d_l7" opacity="0">- 我的问题:换词重搜的自环什么时候该停?</text>
<text x="41" y="254" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11.5" fill="#1d1f24" font-weight="500" class="d_l8" opacity="0">请先读原文位置与涉及的依赖文件,再回答。</text>
</g>
