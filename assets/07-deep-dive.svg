<text x="605" y="193.68" font-family='-apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif' font-size="14.5" fill="#1d1f24" font-weight="500" class="d_type" opacity="0">换词重搜的自环什么时候该停?</text>
