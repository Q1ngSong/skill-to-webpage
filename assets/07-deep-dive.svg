<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">追问打包</title>
<desc id="d">卡片上的 ? 打开追问弹窗,提交后把提问、节点/步骤位置、SKILL.md 行号、依赖文件与知识库路径打成一段文本复制到剪贴板。</desc>
