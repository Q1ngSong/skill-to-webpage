<text x="844" y="368" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12.5" fill="#d97706" font-weight="700">✗ 作废 → 仅该条作废</text>
<text x="846" y="400" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11.5" fill="#5b5f6b">其余照用,交付时列出作废原因</text>
<text x="846" y="422" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#1d1f24">越界 / 缺 source / quote 对不上 / 派生视图无对应边</text>
