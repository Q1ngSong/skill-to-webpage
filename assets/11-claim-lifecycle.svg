<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-labelledby="t d">
<title id="t">一条断言(claim)的生命周期:从 semantics.json 到页面出处</title>
<desc id="d">一条带 source 与 quote 的断言经 validate_semantics.py 的四项检查,通过则进页面并挂 data-source,失败只作废该条;整体回落只在 schema/sha256/行数/layers/unanchored 失败时发生。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3c3f46"/></marker>
<marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f46e5"/></marker>
<marker id="ar-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d97706"/></marker>
<marker id="ar-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#16a34a"/></marker>
</defs>
<rect width="1200" height="560" fill="#fafafa"/>
<text x="24" y="44" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#1d1f24" font-weight="700">一条断言(claim)的生命周期 · 逐条回读,单条作废</text>
<text x="24" y="66" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5b5f6b">唯一硬要求是每条断言带 source + quote,机器可核;通过的进页面挂出处,对不上的只作废该条。</text>
<rect x="24" y="104" width="392" height="150" rx="10" fill="#ffffff" stroke="#e3e4e8" stroke-width="1"/>
<rect x="24" y="104" width="392" height="28" rx="10" fill="#f4f4f7" stroke="none" stroke-width="1"/>
<rect x="24" y="122" width="392" height="10" rx="0" fill="#f4f4f7" stroke="none" stroke-width="1"/>
<line x1="24" y1="132" x2="416" y2="132" stroke="#e3e4e8" stroke-width="1"/>
<text x="38" y="123" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#5b5f6b" font-weight="600">一条断言 · semantics.json 里的一项</text>
<text x="40" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1d1f24" xml:space="preserve">{</text>
<text x="40" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1d1f24" xml:space="preserve">  &quot;text&quot;:   &quot;装机量优先 1K+&quot;,</text>
<text x="40" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#4f46e5" xml:space="preserve">  &quot;source&quot;: &quot;SKILL.md:69&quot;,</text>
<text x="40" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#16a34a" xml:space="preserve">  &quot;quote&quot;:  &quot;Prefer skills with 1K+ installs&quot;</text>
<text x="40" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1d1f24" xml:space="preserve">}</text>
<text x="40" y="274" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">解析器产出;source 指 SKILL.md 行号,quote 是该行里的逐字原文</text>
<rect x="452" y="92" width="322" height="186" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
<rect x="452" y="92" width="322" height="30" rx="10" fill="#eef0fe" stroke="none" stroke-width="1"/>
