<rect x="24" y="466" width="1152" height="66" rx="10" fill="#ffffff" stroke="#e3e4e8" stroke-width="1"/>
<rect x="24" y="466" width="4" height="66" rx="2" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="44" y="492" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#d97706" font-weight="700">整体回落</text>
<text x="108" y="492" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#1d1f24">只在这些失败时发生 —— 该解析器整体作废并告知,其余解析器照跑,永不硬失败</text>
<rect x="44" y="504" width="69.43" height="21" rx="10.5" fill="#fdf3e3" stroke="#f2ddb8" stroke-width="1"/><text x="53" y="518.46" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#d97706">JSON 非法</text>
<rect x="121.43" y="504" width="134.16" height="21" rx="10.5" fill="#fdf3e3" stroke="#f2ddb8" stroke-width="1"/><text x="130.43" y="518.46" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#d97706">schema 不在 /1 /2 /3</text>
<rect x="263.59" y="504" width="81.19" height="21" rx="10.5" fill="#fdf3e3" stroke="#f2ddb8" stroke-width="1"/><text x="272.59" y="518.46" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#d97706">sha256 不符</text>
