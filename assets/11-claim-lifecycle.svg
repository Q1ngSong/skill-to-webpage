<text x="466" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4f46e5" font-weight="600">scripts/validate_semantics.py</text>
<rect x="468" y="138" width="9" height="9" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="485" y="146" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#1d1f24" font-weight="600">source 越界?</text>
<text x="485" y="161" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">行号必须落在 SKILL.md 实际行数内</text>
<rect x="468" y="172" width="9" height="9" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="485" y="180" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#1d1f24" font-weight="600">quote 逐字回读?</text>
<text x="485" y="195" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">在 source 指的行里逐字找得到</text>
<rect x="468" y="206" width="9" height="9" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="485" y="214" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#1d1f24" font-weight="600">端点存在?</text>
<text x="485" y="229" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">nXX / nXX.k 在 static/ 坐标系里有</text>
<rect x="468" y="240" width="9" height="9" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="485" y="248" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#1d1f24" font-weight="600">delegate 有 cross-ref?</text>
<text x="485" y="263" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">跨 skill 边要有 cross-refs.json 兜底</text>
<text x="468" y="298" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">逐条回读核对(消费方行为);渲染 Agent 只做排版与衔接文案</text>
<line x1="422" y1="179" x2="444" y2="179" stroke="#3c3f46" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="830" y="92" width="346" height="216" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<rect x="830" y="92" width="346" height="30" rx="10" fill="#eaf7ee" stroke="none" stroke-width="1"/>
<rect x="830" y="112" width="346" height="10" rx="0" fill="#eaf7ee" stroke="none" stroke-width="1"/>
<line x1="830" y1="122" x2="1176" y2="122" stroke="#cbe9d3" stroke-width="1"/>
<text x="844" y="112" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12.5" fill="#16a34a" font-weight="700">✓ 通过 → 进页面</text>
<text x="846" y="144" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11.5" fill="#5b5f6b">内容块挂 data-source,开「显示出处」可见引文</text>
<rect x="846" y="156" width="314" height="62" rx="7" fill="#fbfbfd" stroke="#e3e4e8" stroke-width="1"/>
<text x="858" y="180" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1d1f24" font-weight="600">装机量优先 1K+</text>
<text x="858" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4f46e5">data-source=&quot;SKILL.md:69&quot;</text>
<text x="1146" y="178" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#8a8f9b" font-weight="700" text-anchor="end">?</text>
