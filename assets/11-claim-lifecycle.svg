<path d="M886,230 L896,223 L906,230 z" fill="#20232b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="874" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a5b4fc">SKILL.md:69</text>
<text x="874" y="264" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#e8e9ee">“Prefer skills with 1K+ installs”</text>
<text x="846" y="328" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b">hover tooltip + 全局「显示出处」开关,可回查具体行</text>
<rect x="830" y="348" width="346" height="96" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
