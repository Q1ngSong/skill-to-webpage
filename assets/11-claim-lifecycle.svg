<rect x="447.86" y="504" width="104.73" height="21" rx="10.5" fill="#fdf3e3" stroke="#f2ddb8" stroke-width="1"/><text x="456.86" y="518.46" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#d97706">unanchored 非空</text>
<rect x="560.6" y="504" width="136.19" height="21" rx="10.5" fill="#fdf3e3" stroke="#f2ddb8" stroke-width="1"/><text x="569.6" y="518.46" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#d97706">layers 未覆盖全部节点</text>
<text x="1156" y="519" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#8a8f9b" text-anchor="end">0 个可用解析器 → 渲染静态基线页,并说明</text>
