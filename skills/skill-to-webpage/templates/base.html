<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
/* ============================================================
   skill-to-webpage 骨架层(base.html)
   布局:Hero(R层) + 流程带 + 侧栏目录 + 详情面板
   机制:CSS 变量换肤 / data-source 出处 / 追问打包 / SVG 子流程图
   槽位 theme_styles(下方,勿在注释里写成双花括号形式)注入全部主题 CSS(docs 的 :root 默认块 +
        3 个 [data-theme] 覆盖块,见 templates/themes/)
   ============================================================ */

/* —— 主题层(渲染时整段注入 4 个 themes/*.css)—— */
{{theme_styles}}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: var(--font-body);
  min-height: 100vh;
}

button { font: inherit; color: inherit; }

.page {
  width: min(1220px, calc(100% - 36px));
  margin: 0 auto;
  padding: 0 0 56px;
}

/* ——— 顶栏 ——— */
.topbar {
  position: sticky;
  top: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.topbar .brand { font: 800 15px/1.2 var(--font-display); letter-spacing: .02em; }
.topbar .brand .lens { color: var(--accent); }
.topbar .spacer { flex: 1; }

.src-toggle {
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  font: 600 12px/1.2 var(--font-display);
  color: var(--muted);
  transition: all .2s;
}

.src-toggle:hover, .src-toggle.active { border-color: var(--accent); color: var(--accent); }

/* 多版本页面切换(渲染多版时由 component_scripts 注入到顶栏;单版页面不出现) */
.variants { display: inline-flex; align-items: center; gap: 6px; margin-right: 8px; }
.variants .vl { color: var(--muted); font: 600 10.5px/1 var(--font-mono); letter-spacing: .06em; margin-right: 2px; }
.variants a { color: var(--muted); text-decoration: none; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; font: 600 11.5px/1 var(--font-display); white-space: nowrap; }
.variants a:hover { color: var(--accent); border-color: var(--accent); }
.variants a.cur { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
@media (max-width: 880px) { .variants .vl { display: none; } }
@media (max-width: 640px) { .topbar { flex-wrap: wrap; row-gap: 6px; } .variants { order: 9; flex-basis: 100%; margin-right: 0; flex-wrap: wrap; } }
.topbar .bundle-back { margin-left: 14px; font: 600 12.5px/1 var(--font-mono); color: var(--ink-soft); text-decoration: none; }
.topbar .bundle-back:hover { color: var(--accent); }
a.xjump { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }

.theme-picker {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: 600 12px/1.2 var(--font-display);
  cursor: pointer;
}

/* ——— Hero:R 层(何时用这个 skill) ——— */
.hero { padding: 44px 4px 8px; }

.hero .eyebrow {
  margin: 0 0 12px;
  color: var(--accent);
  font: 700 13px/1.3 var(--font-display);
  letter-spacing: .14em;
}

.hero h1 {
  margin: 0;
  font-size: clamp(36px, 5.4vw, 62px);
  line-height: 1.04;
  font-weight: 900;
  letter-spacing: -.01em;
}

.hero .lede {
  margin: 18px 0 0;
  max-width: 860px;
  color: var(--ink-soft);
  font-size: 17.5px;
  line-height: 1.8;
}

.hero .thesis {
  margin-top: 22px;
  max-width: 860px;
  border-left: 5px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 16px 20px;
  position: relative;
}

.hero .thesis strong {
  display: block;
  margin-bottom: 6px;
  font: 800 15px/1.3 var(--font-display);
  color: var(--accent);
}

.hero .thesis span { color: var(--ink-soft); font-size: 15.5px; line-height: 1.75; }

/* ——— 流程带(workflow rail):节点语义分组,不放渲染元数据 ——— */
.rail-wrap {
  position: sticky;
  top: 49px;
  z-index: 80;
  margin: 26px 0 24px;
  padding: 14px 4px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.rail {
  display: flex;
  align-items: stretch;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
}

.rail::-webkit-scrollbar { height: 6px; }
.rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.rail .group {
  display: flex;
  align-items: stretch;
  gap: 6px;
  padding: 20px 10px 8px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  position: relative;
  flex: 0 0 auto;
}

.rail .group::before {
  content: attr(data-label);
  position: absolute;
  top: 4px;
  left: 12px;
  color: var(--muted);
  font: 700 10.5px/1 var(--font-display);
  letter-spacing: .12em;
}

.rail .group.main { border-style: solid; border-color: var(--accent); }
.rail .group.main::before { color: var(--accent); }

.node-chip {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  min-width: 108px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) - 3px);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: all .18s;
  flex: 0 0 auto;
}

.node-chip .nid { color: var(--muted); font: 700 10.5px/1 var(--font-mono); letter-spacing: .06em; }
.node-chip .nt { font: 700 13px/1.25 var(--font-display); }
.node-chip .sub { color: var(--muted); font: 500 10.5px/1.2 var(--font-display); }

.node-chip:hover { border-color: var(--accent); transform: translateY(-1px); }

.node-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.node-chip.active .nid, .node-chip.active .sub { color: var(--on-accent); opacity: .75; }

.rail .arrow { align-self: center; color: var(--muted); font: 700 15px/1 var(--font-mono); flex: 0 0 auto; padding: 0 1px; }
.rail .arrow.big { color: var(--accent); font-size: 19px; }

/* ——— 主体:侧栏 + 详情 ——— */
.layout {
  display: grid;
  grid-template-columns: 248px 1fr;
  gap: 24px;
  align-items: start;
}

.sidebar { position: sticky; top: 148px; display: grid; gap: 16px; }

/* grid 子项默认 min-width:auto,会被子流程图的 max-content 画布撑破 */
#panels { min-width: 0; }

.side-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 14px 14px 10px;
}

.side-card .side-title {
  margin: 0 0 10px;
  color: var(--muted);
  font: 700 11px/1.2 var(--font-display);
  letter-spacing: .12em;
}

.toc { display: grid; gap: 2px; }

.toc button {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 6px;
  align-items: baseline;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background .15s;
}

.toc button:hover, .toc button.active { background: var(--accent-soft); }
.toc .tid { color: var(--muted); font: 700 11px/1.4 var(--font-mono); }
.toc button.active .tid { color: var(--accent); }
.toc .tt { font: 600 13px/1.35 var(--font-display); }
.toc .tl { color: var(--muted); font: 500 10px/1.4 var(--font-mono); }

.res-list { display: grid; gap: 6px; padding-bottom: 4px; }

.res-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
  font: 500 11.5px/1.35 var(--font-mono);
  word-break: break-all;
}

.res-item .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--ok); }
.res-item.missing .dot { background: var(--warn); }
.res-empty { color: var(--muted); font: 500 12px/1.5 var(--font-display); padding: 2px 2px 6px; }

/* ——— 详情面板 ——— */
.panel { display: none; animation: rise .32s ease both; min-width: 0; }
.panel.active { display: block; }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.panel-head { margin: 4px 0 18px; position: relative; }
.panel-head .ph-id { color: var(--accent); font: 700 12px/1.2 var(--font-mono); letter-spacing: .08em; }
.panel-head h2 { margin: 6px 0 0; font: 900 28px/1.2 var(--font-display); }

.panel-head .lead {
  margin: 12px 0 0;
  max-width: 780px;
  color: var(--ink-soft);
  font-size: 15.5px;
  line-height: 1.8;
}

/* ——— 通用卡片 ——— */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cards.two { grid-template-columns: repeat(2, 1fr); }

.card {
  position: relative;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

.card h3 { margin: 0 0 8px; font: 800 16px/1.3 var(--font-display); }
.card p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.75; }
.card .when { margin-top: 8px; color: var(--muted); font: 500 12px/1.5 var(--font-display); }

/* ——— 入口/条件分叉卡 ——— */
.forks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.fork {
  position: relative;
  display: block;
  width: 100%;
  padding: 22px 20px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: all .18s;
  box-shadow: var(--shadow);
}

.fork:hover { border-color: var(--accent); transform: translateY(-2px); }
.fork .fk-tag { color: var(--accent); font: 700 12px/1.2 var(--font-display); letter-spacing: .08em; }
.fork h3 { margin: 8px 0 8px; font: 900 19px/1.3 var(--font-display); }
.fork p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
.fork .fk-go { display: block; margin-top: 12px; color: var(--accent); font: 700 13px/1.3 var(--font-display); }

/* ——— 子流程图(subflow:HTML 盒子 + SVG 连线层,环画成真实边) ——— */
.subflow { overflow-x: auto; padding-bottom: 4px; }

.sf-canvas {
  position: relative;
  padding: 56px 6px 10px;
  width: max-content;
  min-width: 100%;
}

.sf-svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

.sf-row { display: flex; gap: 30px; }

.sf-node {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  min-width: 112px;
  max-width: 200px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  cursor: pointer;
  font: 700 12.5px/1.25 var(--font-display);
  text-align: left;
  flex: 0 0 auto;
  transition: border-color .15s, transform .15s;
  box-shadow: var(--shadow);
}

.sf-node .sn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; color: var(--muted); font: 700 10px/1 var(--font-mono); }
.sf-node:hover { border-color: var(--accent); transform: translateY(-1px); }
.sf-node.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sf-node.active .sn { color: var(--on-accent); opacity: .75; }

.ed-f { stroke: var(--muted); stroke-width: 1.5; }
.ed-l { stroke: var(--warn); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; animation: dashflow 1.1s linear infinite; }
.ed-t { fill: var(--warn); font: 700 10.5px var(--font-display); }
.mk-f { fill: var(--muted); }
.mk-l { fill: var(--warn); }

@keyframes dashflow { to { stroke-dashoffset: -18; } }

/* ——— step 内交互组件 ——— */
pre.code {
  position: relative;
  margin: 10px 0;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-ink);
  font: 12.5px/1.7 var(--font-mono);
  overflow-x: auto;
}

code {
  padding: 1.5px 5px;
  border-radius: 5px;
  background: var(--code-bg);
  color: var(--code-ink);
  font: 92% var(--font-mono);
}

pre.code code { padding: 0; background: transparent; }

.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--muted);
  font: 700 11px/1.2 var(--font-display);
  cursor: pointer;
  opacity: 0;
  transition: all .15s;
}

pre.code:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }

.scroll { overflow-x: auto; margin: 10px 0; }

table.tbl { width: 100%; border-collapse: collapse; font: 13.5px/1.6 var(--font-body); }
.tbl th, .tbl td { padding: 9px 11px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font: 700 12.5px/1.4 var(--font-display); white-space: nowrap; }
.tbl td { color: var(--ink-soft); }
.tbl tbody tr:hover { background: var(--accent-soft); }

table.rowsel tbody tr { cursor: pointer; }
table.rowsel tbody tr.rowon { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }

.row-echo {
  margin: 8px 0 2px;
  padding: 9px 13px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 8px 8px 0;
  color: var(--ink);
  font: 700 13.5px/1.6 var(--font-display);
}

.checklist { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
.checklist li { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.checklist label {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--ink-soft);
}

.checklist input { accent-color: var(--accent); width: 15px; height: 15px; flex: 0 0 auto; }
.checklist input:checked + span { color: var(--muted); text-decoration: line-through; }

.ck-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font: 700 12px/1.6 var(--font-display);
}

.ck-badge.done { background: var(--ok); color: #ffffff; }

.acc { margin: 10px 0; display: grid; gap: 6px; }
.acc details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.acc summary { padding: 10px 14px; cursor: pointer; font: 700 13.5px/1.4 var(--font-display); list-style: none; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::before { content: "+"; display: inline-block; width: 16px; color: var(--accent); font-weight: 900; }
.acc details[open] summary::before { content: "−"; }
.acc .acc-body { padding: 0 14px 12px 30px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }

.tree { margin: 10px 0; display: grid; gap: 4px; }
.tree details { border: 1px solid var(--line); border-radius: 7px; background: var(--code-bg); }
.tree summary { padding: 8px 12px; cursor: pointer; font: 600 12.5px/1.4 var(--font-mono); color: var(--code-ink); list-style: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree .tree-desc { padding: 0 12px 10px 26px; color: var(--ink-soft); font: 400 12.5px/1.6 var(--font-display); }

/* ——— 规则列表(错误处理/边界类内容) ——— */
.rules { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 8px; }

.rules li {
  position: relative;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink-soft);
}

.rules li strong { color: var(--ink); }
.rules li .fb { display: block; margin-top: 7px; }

/* ——— explain-card(子步骤详情) ——— */
.explain-card {
  display: none;
  position: relative;
  margin-top: 12px;
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.explain-card.active { display: block; animation: rise .28s ease both; }
.explain-card h4 { margin: 0 0 10px; font: 800 16px/1.3 var(--font-display); }
.explain-card p { margin: 0 0 10px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.8; }
.explain-card ul, .explain-card ol { margin: 0 0 10px; padding-left: 22px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.85; }
.explain-card li { margin-bottom: 3px; }
.explain-card .hint { color: var(--muted); font-size: 13px; }

/* ——— 环说明卡与跳转 ——— */
p.loop-note {
  padding: 9px 13px;
  border: 1px dashed var(--warn);
  border-radius: 8px;
  font-size: 13.5px;
}

.jump {
  display: inline-block;
  padding: 1px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2);
  cursor: pointer;
  font: 700 12px/1.5 var(--font-display);
  color: var(--accent);
  vertical-align: baseline;
}

.jump:hover { border-color: var(--accent); }

/* ——— 出处标注(A:margin 细条 + tooltip;B:全局开关) ——— */
[data-source] { position: relative; }

.card[data-source], .explain-card[data-source], .fork[data-source],
.rules li[data-source], .hero .thesis[data-source], .hero .lede[data-source] {
  border-left: 3px solid var(--line);
  transition: border-left-color .2s;
}

.card[data-source]:hover, .explain-card[data-source]:hover, .fork[data-source]:hover,
.rules li[data-source]:hover, .hero .thesis[data-source]:hover, .hero .lede[data-source]:hover {
  border-left-color: var(--accent);
}

.hero .thesis[data-source] { border-left-width: 5px; border-left-color: var(--accent); }

[data-source]::after {
  content: attr(data-source);
  position: absolute;
  left: 0;
  bottom: calc(100% + 5px);
  padding: 3px 9px;
  background: var(--tooltip-bg);
  color: var(--tooltip-ink);
  font: 600 10.5px/1.4 var(--font-mono);
  border-radius: 5px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 60;
}

[data-source]:hover::after { opacity: 1; }

body.show-sources .card[data-source]::before,
body.show-sources .explain-card[data-source]::before,
body.show-sources .fork[data-source]::before,
body.show-sources .rules li[data-source]::before {
  content: attr(data-source);
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font: 600 10.5px/1.4 var(--font-mono);
}

/* ——— 追问按钮 + 弹窗 ——— */
.deep-dive-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font: 700 13px/1 var(--font-display);
  opacity: 0;
  transition: all .2s;
  z-index: 2;
}

.card:hover .deep-dive-btn, .explain-card:hover .deep-dive-btn,
.fork:hover .deep-dive-btn, .rules li:hover .deep-dive-btn { opacity: .7; }

.deep-dive-btn:hover { opacity: 1 !important; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.dd-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(10, 10, 14, .38);
  backdrop-filter: blur(3px);
  align-items: center;
  justify-content: center;
}

.dd-overlay.active { display: flex; }

.dd-popover {
  width: min(540px, calc(100% - 32px));
  padding: 26px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
}

.dd-popover .dd-title { margin: 0 0 6px; font: 800 19px/1.3 var(--font-display); }
.dd-popover .dd-ctx { margin: 0 0 14px; color: var(--muted); font: 500 12.5px/1.6 var(--font-display); }

.dd-popover textarea {
  width: 100%;
  min-height: 76px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font: 14.5px/1.6 var(--font-body);
  color: var(--ink);
  background: var(--bg);
  resize: vertical;
  margin-bottom: 12px;
}

.dd-actions { display: flex; gap: 8px; }

.dd-submit {
  padding: 10px 20px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  font: 700 13.5px/1.3 var(--font-display);
}

.dd-cancel {
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font: 700 13.5px/1.3 var(--font-display);
  color: var(--muted);
}

.dd-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 13px 26px;
  background: var(--tooltip-bg);
  color: var(--tooltip-ink);
  border-radius: 8px;
  font: 600 13px/1.4 var(--font-display);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 300;
}

.dd-toast.show { opacity: 1; }

/* ——— 上一步/下一步 ——— */
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }

.pager button {
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  font: 700 13.5px/1.3 var(--font-display);
  transition: all .18s;
  max-width: 48%;
  text-align: left;
}

.pager button:hover { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: .35; cursor: default; }
.pager button:disabled:hover { border-color: var(--line); color: inherit; }
.pager .dir { display: block; color: var(--muted); font: 600 10.5px/1.3 var(--font-mono); margin-bottom: 3px; }

/* ——— 页脚 ——— */
.footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font: 500 12.5px/1.8 var(--font-display);
}

/* ——— 响应式 ——— */
@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .side-card.toc-card { display: none; }
  .cards, .cards.two, .forks { grid-template-columns: 1fr; }
  .rail-wrap { top: 45px; }
  .hero h1 { font-size: 38px; }
}

@media (max-width: 520px) {
  .page { width: calc(100% - 22px); }
  .hero { padding-top: 26px; }
  .hero h1 { font-size: 32px; }
  .panel-head h2 { font-size: 23px; }
  .sf-row { gap: 22px; }
}

/* ——— 组件专属附加样式(渲染时按需注入) ——— */
/* ——— 语义层(s2w-semantics/2)视觉词汇:无语义数据时这些选择器不会出现,对 /1 页面静默 ——— */
.hero .thesis .wsa { display: inline-block; margin-top: 10px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft); font: 700 11.5px/1.4 var(--font-mono); letter-spacing: .04em; }
.rail-sem { position: relative; display: grid; gap: 16px; width: max-content; min-width: 100%; }
.rail-main, .rail-sat { display: flex; align-items: stretch; gap: 6px; }
.rail-sat { position: relative; display: block; padding: 0; }
.rail-sat::before { content: attr(data-label); position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: var(--muted); font: 600 10.5px/1.3 var(--font-display); white-space: nowrap; }
.rail-sat .node-chip { position: absolute; top: 0; border-style: dashed; opacity: .88; }
.rail-sat .node-chip.active { border-style: solid; opacity: 1; }
.rail-svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.rl-d { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 2 4; }
.rail .arrow.cap { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rail .arrow.cap::after { content: attr(data-cap); color: var(--warn); font: 600 9.5px/1.2 var(--font-display); white-space: nowrap; }
.sf-node .sf-when { display: block; color: var(--accent); font: 600 9.5px/1.2 var(--font-display); }
.sf-node .sf-type { display: inline-block; margin-left: auto; color: var(--muted); font: 700 9.5px/1 var(--font-mono); letter-spacing: .06em; }
.sf-node .t-tool { color: var(--accent); } .sf-node .t-gate, .sf-node .t-fb { color: var(--warn); } .sf-node .t-out { color: var(--ok); }
.sf-node .sf-gate { display: block; margin-top: 3px; color: var(--warn); font: 700 10px/1.2 var(--font-display); }

.sf-end { align-self: center; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink-soft); font: 700 20px/1 var(--font-mono); padding: 0 6px; }

.sf-ext { position: absolute; top: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; max-width: 208px; padding: 7px 10px; border: 1px dotted var(--muted); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; font: 700 12px/1.25 var(--font-display); color: var(--ink); box-shadow: var(--shadow); }
.sf-ext .xid { color: var(--muted); font: 700 9.5px/1 var(--font-mono); letter-spacing: .06em; }

<body data-theme="{{default_theme}}">

<div class="page">

  <!-- 顶栏 -->
  <div class="topbar">
    <span class="brand"><span class="lens">◈</span> skill-to-webpage</span>
    <span class="spacer"></span>
    <button id="srcToggle" class="src-toggle" title="显示/隐藏出处">显示出处</button>
    <select id="themePicker" class="theme-picker" title="切换主题">
      <option value="docs">简洁文档</option>
      <option value="blueprint">技术蓝图</option>
      <option value="ide">终端 IDE</option>
      <option value="whiteboard">白板手绘</option>
    </select>
  </div>

  <!-- Hero:R 层(skill 名 + description 原文 + 执行总纲) -->
  <header class="hero">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{skill_name}}</h1>
    <p class="lede" data-source="{{description_source}}">{{description_html}}</p>
    <div class="thesis" data-source="{{thesis_source}}">
      <strong>{{thesis_title}}</strong>
      <span>{{thesis_html}}</span>
    </div>
  </header>

  <!-- 流程带:节点按语义分组(理念/执行/支撑),芯片副标题写节点做什么 -->
  <div class="rail-wrap">
    <div class="rail" id="rail">
      {{rail_groups}}
    </div>
  </div>

  <div class="layout">

    <!-- 侧栏:节点目录(带行号) + 当前节点资源(存在性徽章) -->
    <aside class="sidebar">
      <div class="side-card toc-card">
        <p class="side-title">节点目录</p>
        <nav class="toc" id="toc">
          {{toc_items}}
        </nav>
      </div>
      <div class="side-card">
        <p class="side-title">本节点引用的资源</p>
        <div class="res-list" id="resList"></div>
      </div>
    </aside>

    <!-- 详情面板:每个节点一个 <section class="panel" id="p-nXX"> -->
    <main id="panels">
      {{panels}}
    </main>
  </div>

  <footer class="footer">{{footer_note}}</footer>
</div>

<!-- 追问弹窗 -->
<div class="dd-overlay" id="ddOverlay">
  <div class="dd-popover">
    <p class="dd-title" id="ddTitle"></p>
    <p class="dd-ctx" id="ddCtx"></p>
    <textarea id="ddInput" placeholder="输入你想追问的细节…"></textarea>
    <div class="dd-actions">
      <button class="dd-submit" id="ddSubmit">打包复制追问到剪贴板</button>
      <button class="dd-cancel" id="ddCancel">取消</button>
    </div>
  </div>
</div>
<div class="dd-toast" id="ddToast"></div>

<script>
/* JS 安全规则(CRITICAL):var / function() / DOM 前 null 守卫 / 字符串内无中文弯引号 */

/* ——— 渲染时注入的页面数据 ——— */
var SKILL_NAME = "{{skill_name_js}}";
var SKILL_DIR = "{{skill_dir}}";
var KB_DIR = "{{kb_dir}}";
var NODES = {{nodes_json}};
var NODE_TITLES = {{node_titles_json}};
var NODE_RES = {{node_res_json}};
var SUBFLOW_LOOPS = {{subflow_loops_json}};
var SEM_EDGES = {};   /* 语义层(可选):{"st-nXX": {arcs: [{from,to,label,inf}], end: {from,label,inf}}},渲染时经 component_scripts 赋值 */
var RAIL_LINKS = [];  /* 语义层(可选):流程带支撑行 → 主线的依赖弧 [{from,to}] */

/* ——— 侧栏资源渲染 ——— */
function renderResources(nodeId) {
  var box = document.getElementById("resList");
  if (!box) { return; }
  var list = NODE_RES[nodeId] || [];
  if (list.length === 0) {
    box.innerHTML = '<p class="res-empty">本节点未引用资源文件</p>';
    return;
  }
  var html = "";
  var i;
  for (i = 0; i < list.length; i++) {
    var cls = list[i][1] ? "res-item" : "res-item missing";
    var label = list[i][1] ? "存在" : "缺失";
    html += '<div class="' + cls + '" title="' + label + '"><span class="dot"></span>' + list[i][0] + "</div>";
  }
  box.innerHTML = html;
}

/* ——— 上一步/下一步 ——— */
function renderPager(nodeId) {
  var idx = -1;
  var i;
  for (i = 0; i < NODES.length; i++) { if (NODES[i] === nodeId) { idx = i; } }
  var panel = document.getElementById("p-" + nodeId);
  if (!panel) { return; }
  var pager = panel.querySelector(".pager");
  if (!pager) { return; }
  var html = "";
  if (idx > 0) {
    var prev = NODES[idx - 1];
    html += '<button onclick="showNode(\'' + prev + '\')"><span class="dir">← 上一节点</span>' + prev + " · " + NODE_TITLES[prev] + "</button>";
  } else {
    html += "<button disabled><span class=\"dir\">← 上一节点</span>已是起点</button>";
  }
  if (idx < NODES.length - 1) {
    var next = NODES[idx + 1];
    html += '<button onclick="showNode(\'' + next + '\')" style="text-align:right"><span class="dir">下一节点 →</span>' + next + " · " + NODE_TITLES[next] + "</button>";
  } else {
    html += "<button disabled style=\"text-align:right\"><span class=\"dir\">下一节点 →</span>已是终点</button>";
  }
  pager.innerHTML = html;
}

/* ——— 节点切换 ——— */
function showNode(nodeId) {
  var panels = document.querySelectorAll(".panel");
  var i;
  for (i = 0; i < panels.length; i++) { panels[i].classList.remove("active"); }
  var target = document.getElementById("p-" + nodeId);
  if (target) { target.classList.add("active"); }

  var chips = document.querySelectorAll(".node-chip");
  for (i = 0; i < chips.length; i++) {
    if (chips[i].getAttribute("data-node") === nodeId) { chips[i].classList.add("active"); }
    else { chips[i].classList.remove("active"); }
  }
  var tocBtns = document.querySelectorAll(".toc button");
  for (i = 0; i < tocBtns.length; i++) {
    if (tocBtns[i].getAttribute("data-node") === nodeId) { tocBtns[i].classList.add("active"); }
    else { tocBtns[i].classList.remove("active"); }
  }
  renderResources(nodeId);
  renderPager(nodeId);
  redrawActiveSubflows();
  var rail = document.getElementById("rail");
  if (rail) {
    var activeChip = rail.querySelector(".node-chip.active");
    if (activeChip && activeChip.scrollIntoView) {
      activeChip.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    }
  }
}

/* ——— 跳到某节点的某个子步骤 ——— */
function showStep(nodeId, explainId) {
  showNode(nodeId);
  if (!explainId) { return; }
  var panel = document.getElementById("p-" + nodeId);
  if (!panel) { return; }
  var btns = panel.querySelectorAll(".sf-node");
  var i;
  for (i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute("data-x") === explainId && btns[i].onclick) { btns[i].onclick(); }
  }
}

(function bindNav() {
  var btns = document.querySelectorAll("[data-node]");
  var i;
  for (i = 0; i < btns.length; i++) {
    (function (btn) {
      btn.onclick = function () { showNode(btn.getAttribute("data-node")); };
    })(btns[i]);
  }
})();

/* ——— 布局工具(语义层共用;无语义数据时不会被调用) ——— */
{{flow_lib}}

/* ——— 连线选中:单击一条线,高亮它的两端,同一张图里的其它线与盒子淡出 ———
   选中态按容器(每个 stepper / 流程带)分别记,重画(展开、换窗宽)后由 sfApplyFocus 复原 */
var SF_FOCUS = {};

function sfRootKey(root) { return root.id || "sf-root"; }

function sfSetCls(el, name, want) {
  var cur = el.getAttribute("class") || "";
  var has = (" " + cur + " ").indexOf(" " + name + " ") >= 0;
  if (want === has) { return; }
  el.setAttribute("class", want ? (cur + " " + name)
    : (" " + cur + " ").replace(" " + name + " ", " ").replace(/^\s+|\s+$/g, ""));
}

/* 盒子的端点键:步骤盒子用 data-x,外部卡片 / END 用 data-extkey,流程带芯片用 rail:<节点 id> */
function sfBoxKey(el) {
  if (!el || !el.getAttribute) { return null; }
  if (el.getAttribute("data-x")) { return el.getAttribute("data-x"); }
  if (el.getAttribute("data-extkey")) { return el.getAttribute("data-extkey"); }
  if (el.getAttribute("data-node")) { return "rail:" + el.getAttribute("data-node"); }
  return null;
}

function sfApplyFocus(root) {
  if (!root) { return; }
  var f = SF_FOCUS[sfRootKey(root)] || null;
  var edges = root.querySelectorAll("[data-efrom]");   /* 线 + 线上的标签 */
  var boxes = root.querySelectorAll(".sf-node, .sf-ext, .sf-end, .node-chip");
  var i;
  for (i = 0; i < edges.length; i++) {
    var hit = f !== null && edges[i].getAttribute("data-efrom") === f.from && edges[i].getAttribute("data-eto") === f.to;
    sfSetCls(edges[i], "focus", f !== null && hit);
    sfSetCls(edges[i], "dim", f !== null && !hit);
  }
  for (i = 0; i < boxes.length; i++) {
    var k = sfBoxKey(boxes[i]);
    var on = f !== null && k !== null && (k === f.from || k === f.to);
    sfSetCls(boxes[i], "focus", f !== null && on);
    sfSetCls(boxes[i], "dim", f !== null && !on);
  }
}

function sfClearFocus() {
  SF_FOCUS = {};
  var roots = document.querySelectorAll(".stepper, #railSem"), i;
  for (i = 0; i < roots.length; i++) { sfApplyFocus(roots[i]); }
}

(function bindSfFocus() {
  document.addEventListener("click", function (ev) {
    var el = ev.target, edge = null, root = null;
    while (el && el !== document.body) {
      if (!edge && el.getAttribute && el.getAttribute("data-efrom") !== null && el.getAttribute("data-eto") !== null) { edge = el; }
      if (el.className !== undefined && el.id === "railSem") { root = el; break; }
      if (el.classList && el.classList.contains && el.classList.contains("stepper")) { root = el; break; }
      el = el.parentNode;
    }
    if (!root) { return; }
    var key = sfRootKey(root), cur = SF_FOCUS[key] || null;
    if (!edge) { SF_FOCUS[key] = null; }          /* 点空白 / 点盒子:清掉选中,节点自身的点击行为不变 */
    else {
      var f = { from: edge.getAttribute("data-efrom"), to: edge.getAttribute("data-eto") };
      SF_FOCUS[key] = (cur && cur.from === f.from && cur.to === f.to) ? null : f;
    }
    sfApplyFocus(root);
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" || ev.keyCode === 27) { sfClearFocus(); }
  });
})();

/* ——— 子流程图绘制:顺序边直线 + 上方弧线(回边 / 自环 / 条件跳转,按跨度分层避让)+ 外部节点栏(依赖来源 / 兜底去向,正交布线)+ 终止标记 ——— */
function semLayoutLane(stepper, canvas) {
  var lane = stepper.querySelector(".sf-lane");
  var row = stepper.querySelector(".sf-row");
  if (!lane || !row) { canvas.style.paddingBottom = ""; return; }
  var exts = lane.querySelectorAll(".sf-ext");
  var i, j, nLinks = 0, natMax = 0, maxH = 0;
  for (i = 0; i < exts.length; i++) { exts[i].style.width = ""; exts[i].style.height = ""; }
  for (i = 0; i < exts.length; i++) {
    nLinks += (exts[i].getAttribute("data-at") || exts[i].getAttribute("data-from") || "").split(",").length;
    if (exts[i].offsetWidth > natMax) { natMax = exts[i].offsetWidth; }
  }
  for (i = 0; i < exts.length; i++) { exts[i].style.width = natMax + "px"; }
  var gap = Math.max(36, 18 + 10 * nLinks);
  var rowBottom = row.offsetTop + row.offsetHeight;
  lane.style.top = (rowBottom + gap) + "px";
  var items = [];
  for (i = 0; i < exts.length; i++) {
    var ex = exts[i];
    var refs = (ex.getAttribute("data-at") || ex.getAttribute("data-from") || "").split(",");
    var sum = 0, n = 0;
    for (j = 0; j < refs.length; j++) {
      var b = stepper.querySelector('.sf-node[data-x="' + refs[j] + '"]');
      if (b) { sum += b.offsetLeft + b.offsetWidth / 2; n++; }
    }
    items.push({ el: ex, want: (n > 0 ? sum / n : 0) - ex.offsetWidth / 2, w: ex.offsetWidth });
    if (ex.offsetHeight > maxH) { maxH = ex.offsetHeight; }
  }
  semPlace1D(items, 0, 12);
  for (i = 0; i < items.length; i++) { items[i].el.style.left = Math.round(items[i].left) + "px"; items[i].el.style.height = maxH + "px"; }
  lane.style.height = maxH + "px";
  canvas.style.paddingBottom = (gap + maxH + 16) + "px";
}

function drawSubflow(stepperId) {
  var stepper = document.getElementById(stepperId);
  if (!stepper) { return; }
  var canvas = stepper.querySelector(".sf-canvas");
  var svg = stepper.querySelector(".sf-svg");
  var nodes = stepper.querySelectorAll(".sf-node");
  if (!canvas || !svg || nodes.length === 0) { return; }
  var i, j;
  var idx = {};
  for (i = 0; i < nodes.length; i++) { idx[nodes[i].getAttribute("data-x")] = i; }

  /* 同行盒子等宽:自然宽取最大(CSS 夹在 112–200px),高度随行拉伸、内容垂直居中 */
  var natMax = 0;
  for (i = 0; i < nodes.length; i++) { nodes[i].style.width = ""; }
  for (i = 0; i < nodes.length; i++) { var nw = nodes[i].getBoundingClientRect().width; if (nw > natMax) { natMax = nw; } }
  natMax = Math.ceil(natMax) + 2; /* 留 2px 余量:编号行是可换行 flex,正好贴边时会因亚像素取整折行 */
  for (i = 0; i < nodes.length; i++) { nodes[i].style.width = natMax + "px"; }

  /* 上方弧线分层:跨度短的在下;与已放置弧线重叠则抬一层 */
  var sem = SEM_EDGES[stepperId] || {};
  var arcs = [];
  var loops = SUBFLOW_LOOPS[stepperId] || [];
  for (i = 0; i < loops.length; i++) { arcs.push({ kind: "loop", e: loops[i] }); }
  var skips = sem.arcs || [];
  for (i = 0; i < skips.length; i++) { arcs.push({ kind: "skip", e: skips[i] }); }
  var maxLevel = 0;
  for (i = 0; i < arcs.length; i++) {
    var ia = idx[arcs[i].e.from], ib = idx[arcs[i].e.to];
    if (ia === undefined || ib === undefined) { arcs[i].bad = true; continue; }
    arcs[i].lo = Math.min(ia, ib);
    arcs[i].hi = Math.max(ia, ib);
    arcs[i].span = arcs[i].hi - arcs[i].lo;
  }
  arcs.sort(function (p, q) { return p.span - q.span; });
  for (i = 0; i < arcs.length; i++) {
    if (arcs[i].bad) { continue; }
    var level = 1;
    for (j = 0; j < i; j++) {
      if (arcs[j].bad) { continue; }
      var overlap = !(arcs[i].hi < arcs[j].lo || arcs[i].lo > arcs[j].hi);
      if (overlap && arcs[j].level >= level) { level = arcs[j].level + 1; }
    }
    arcs[i].level = level;
    if (level > maxLevel) { maxLevel = level; }
  }
  canvas.style.paddingTop = Math.max(56, 30 + 26 * maxLevel) + "px";
  semLayoutLane(stepper, canvas);

  var W = canvas.scrollWidth;
  var H = canvas.scrollHeight;
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  function marker(id, cls, size) {
    return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="' + size + '" markerHeight="' + size + '" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="' + cls + '"></path></marker>';
  }
  var parts = ["<defs>" + marker(stepperId + "-mf", "mk-f", 7) + marker(stepperId + "-ml", "mk-l", 6.5) + marker(stepperId + "-mc", "mk-c", 6.5) + marker(stepperId + "-md", "mk-d", 6) + marker(stepperId + "-mx", "mk-x", 6.5) + marker(stepperId + "-me", "mk-e", 6.5) + "</defs>"];
  var pos = {};
  for (i = 0; i < nodes.length; i++) {
    var b = nodes[i];
    pos[b.getAttribute("data-x")] = { l: b.offsetLeft, t: b.offsetTop, w: b.offsetWidth, h: b.offsetHeight };
  }

  /* 顺序边 */
  for (i = 0; i < nodes.length - 1; i++) {
    var a = pos[nodes[i].getAttribute("data-x")];
    var c = pos[nodes[i + 1].getAttribute("data-x")];
    if (!a || !c) { continue; }
    parts.push('<line x1="' + (a.l + a.w + 1) + '" y1="' + (a.t + a.h / 2) + '" x2="' + (c.l - 3) + '" y2="' + (c.t + c.h / 2) + '" class="ed-f sfe" data-efrom="' + nodes[i].getAttribute("data-x") + '" data-eto="' + nodes[i + 1].getAttribute("data-x") + '" marker-end="url(#' + stepperId + '-mf)"></line>');
  }

  /* 上方弧线:回边 / 自环(ed-l,橙色流动虚线)与条件跳转(ed-c,蓝色;推断为虚线) */
  for (i = 0; i < arcs.length; i++) {
    if (arcs[i].bad) { continue; }
    var e = arcs[i].e;
    var s = pos[e.from];
    var t = pos[e.to];
    if (!s || !t) { continue; }
    var L = arcs[i].level;
    var isLoop = arcs[i].kind === "loop";
    var cls = isLoop ? "ed-l" : ("ed-c" + (e.inf ? " inf" : ""));
    var d, lx, ly;
    if (e.from === e.to) {
      var cx = s.l + s.w / 2;
      var cy = s.t - (10 + 26 * L);
      d = "M " + (cx + 16) + " " + (s.t - 1) + " C " + (cx + 44) + " " + cy + ", " + (cx - 44) + " " + cy + ", " + (cx - 16) + " " + (s.t - 1);
      lx = cx;
      ly = s.t - (6 + 26 * L);
    } else {
      var x1 = s.l + s.w / 2;
      var x2 = t.l + t.w / 2;
      var topY = Math.min(s.t, t.t);
      var py = topY - (14 + 26 * L);
      d = "M " + x1 + " " + (s.t - 1) + " C " + x1 + " " + py + ", " + x2 + " " + py + ", " + x2 + " " + (t.t - 1);
      lx = (x1 + x2) / 2;
      ly = topY - (8 + 26 * L);
    }
    parts.push('<path d="' + d + '" class="' + cls + ' sfe" data-efrom="' + e.from + '" data-eto="' + e.to + '" marker-end="url(#' + stepperId + (isLoop ? "-ml" : "-mc") + ')"></path>');
    var label = e.label + (e.inf ? " · 推断" : "");
    var halfLabel = label.length * 5.5;
    if (lx < halfLabel + 4) { lx = halfLabel + 4; }
    if (lx > W - halfLabel - 4) { lx = W - halfLabel - 4; }
    parts.push('<text x="' + lx + '" y="' + ly + '" text-anchor="middle" class="' + (isLoop ? "ed-t" : "ed-ct") + ' sfl" data-efrom="' + e.from + '" data-eto="' + e.to + '">' + label + "</text>");
  }

  /* 外部节点栏:依赖来源(点线,上箭头汇入步骤)/ 兜底去向(橙线,下箭头汇入外部节点);正交布线,每线一轨 */
  var lane = stepper.querySelector(".sf-lane");
  var row = stepper.querySelector(".sf-row");
  if (lane && row) {
    var exts = lane.querySelectorAll(".sf-ext");
    var links = [];
    for (i = 0; i < exts.length; i++) {
      var ex = exts[i];
      var isOut = ex.classList.contains("out");
      var exRect = { l: lane.offsetLeft + ex.offsetLeft, t: lane.offsetTop + ex.offsetTop, w: ex.offsetWidth, h: ex.offsetHeight };
      ex.setAttribute("data-extkey", "ext:x" + i);
      var refs1 = (ex.getAttribute("data-at") || ex.getAttribute("data-from") || "").split(",");
      var infs = (ex.getAttribute("data-inf") || "").split(",");
      for (j = 0; j < refs1.length; j++) {
        if (!pos[refs1[j]]) { continue; }
        links.push({ rowBox: pos[refs1[j]], satBox: exRect, rowKey: refs1[j], satKey: "ext:x" + i, dir: isOut ? "down" : "up",
                     cls: (isOut ? "ed-x" : "ed-d") + (infs[j] === "1" ? " inf" : ""), mk: isOut ? "-mx" : "-md" });
      }
    }
    var routed = semRouteLane(links, row.offsetTop + row.offsetHeight, lane.offsetTop);
    for (i = 0; i < routed.length; i++) {
      /* up = 箭头汇入主行盒子(依赖来源:外部 → 步骤);down = 箭头汇入外部卡片(兜底去向) */
      var lf = routed[i].dir === "up" ? routed[i].satKey : routed[i].rowKey;
      var lt = routed[i].dir === "up" ? routed[i].rowKey : routed[i].satKey;
      parts.push('<path d="' + routed[i].d + '" class="' + routed[i].cls + ' sfe" data-efrom="' + lf + '" data-eto="' + lt + '" marker-end="url(#' + stepperId + routed[i].mk + ')"></path>');
    }
  }

  /* 终止标记:最后一步 → ⦿ END */
  var endEl = stepper.querySelector(".sf-end");
  if (endEl && sem.end && pos[sem.end.from]) {
    var se = pos[sem.end.from];
    var ex1 = endEl.offsetLeft, ey1 = endEl.offsetTop + endEl.offsetHeight / 2;
    endEl.setAttribute("data-extkey", "ext:END");
    parts.push('<path d="M ' + (se.l + se.w + 1) + ' ' + (se.t + se.h / 2) + ' L ' + (ex1 - 2) + ' ' + ey1 + '" class="ed-e' + (sem.end.inf ? " inf" : "") + ' sfe" data-efrom="' + sem.end.from + '" data-eto="ext:END" marker-end="url(#' + stepperId + '-me)"></path>');
    parts.push('<text x="' + (ex1 + endEl.offsetWidth / 2) + '" y="' + (endEl.offsetTop + endEl.offsetHeight + 14) + '" text-anchor="middle" class="ed-et sfl" data-efrom="' + sem.end.from + '" data-eto="ext:END">' + sem.end.label + (sem.end.inf ? " · 推断" : "") + "</text>");
  }
  svg.innerHTML = parts.join("");
  sfApplyFocus(stepper);
}

/* ——— 追问弹窗:提问 + 位置 + 依赖文件,打包复制给 Agent ——— */
(function bindDeepDive() {
  var overlay = document.getElementById("ddOverlay");
  var titleEl = document.getElementById("ddTitle");
  var ctxEl = document.getElementById("ddCtx");
  var input = document.getElementById("ddInput");
  var toast = document.getElementById("ddToast");
  if (!overlay || !titleEl || !ctxEl || !input || !toast) { return; }
  var currentRef = "";
  var currentConcept = "";
  var currentDeps = [];

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }
  window.flashToast = showToast;

  /* 依赖收集:内容块文本里的资源路径 + 当前节点挂载的资源(Phase 1 抽取产物),去重合并 */
  function findDeps(el) {
    var out = [];
    var seen = {};
    if (el) {
      var tokens = el.textContent.split(/[^A-Za-z0-9_.\/-]+/);
      var i;
      for (i = 0; i < tokens.length; i++) {
        var tk = tokens[i].replace(/[.,;:]+$/, "");
        if (/^(scripts|templates|references|examples|assets)\/[A-Za-z0-9_.\/-]*$/.test(tk)) {
          if (!seen[tk]) { seen[tk] = 1; out.push(tk); }
        }
      }
    }
    var activePanel = document.querySelector(".panel.active");
    if (activePanel) {
      var nodeId = activePanel.id.replace("p-", "");
      var res = NODE_RES[nodeId] || [];
      var j;
      for (j = 0; j < res.length; j++) {
        if (!seen[res[j][0]]) { seen[res[j][0]] = 1; out.push(res[j][0]); }
      }
    }
    return out;
  }

  window.openDeepDive = function (conceptName, source) {
    currentRef = source;
    currentConcept = conceptName;
    var block = document.querySelector('.panel.active [data-source="' + source + '"]') || document.querySelector('[data-source="' + source + '"]');
    currentDeps = findDeps(block);
    titleEl.textContent = "追问「" + conceptName + "」";
    var depsHint = currentDeps.length > 0
      ? " · 依赖:" + currentDeps.slice(0, 3).join("、") + (currentDeps.length > 3 ? " 等 " + currentDeps.length + " 项" : "")
      : "";
    ctxEl.textContent = "出处:" + source + depsHint + " | 提交后把提问 + 位置 + 依赖文件打包复制到剪贴板,贴给 Agent 即可。";
    input.value = "";
    overlay.classList.add("active");
    setTimeout(function () { input.focus(); }, 180);
  };

  var cancelBtn = document.getElementById("ddCancel");
  if (cancelBtn) { cancelBtn.onclick = function () { overlay.classList.remove("active"); }; }

  overlay.onclick = function (e) {
    if (e.target === overlay) { overlay.classList.remove("active"); }
  };

  var submitBtn = document.getElementById("ddSubmit");
  if (submitBtn) {
    submitBtn.onclick = function () {
      var q = input.value.replace(/^\s+|\s+$/g, "");
      if (!q) { showToast("请输入你的问题"); return; }
      var nodeLoc = "";
      var activePanel = document.querySelector(".panel.active");
      if (activePanel) {
        var phId = activePanel.querySelector(".ph-id");
        var phTitle = activePanel.querySelector("h2");
        if (phId && phTitle) { nodeLoc = phId.textContent.split(" · ")[0] + "「" + phTitle.textContent + "」 > "; }
      }
      var depLines = "";
      var i;
      if (currentDeps.length > 0) {
        for (i = 0; i < currentDeps.length; i++) {
          depLines += "  - " + SKILL_DIR + "/" + currentDeps[i] + "\n";
        }
      } else {
        depLines = "  - (该内容块未显式引用依赖文件)\n";
      }
      var prompt = "【追问 · 由 skill-to-webpage 页面打包】\n"
        + "- Skill:" + SKILL_NAME + "(源目录:" + SKILL_DIR + ")\n"
        + "- 提问对象:" + nodeLoc + "「" + currentConcept + "」\n"
        + "- 原文位置:" + SKILL_DIR + "/SKILL.md 的 " + currentRef.replace("SKILL.md:", "第 ") + " 行\n"
        + "- 涉及依赖文件:\n" + depLines
        + "- 知识库:" + KB_DIR + "(full_text.md 行号与原文位置一致,节点摘要在 nodes/)\n"
        + "- 我的问题:" + q + "\n\n"
        + "请先读原文位置与涉及的依赖文件,再回答。";
      window.__lastPrompt = prompt;
      function fallbackShow() {
        input.value = prompt;
        showToast("剪贴板不可用,已把打包内容放入输入框,请手动全选复制");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(prompt).then(function () {
          overlay.classList.remove("active");
          showToast("追问已打包复制(提问 + 位置 + 依赖文件),贴给 Agent 即可");
        }).catch(fallbackShow);
      } else {
        fallbackShow();
      }
    };
  }
})();

/* ——— 流程带芯片等宽:主行芯片同宽(自然宽取最大、≤200,装不下时缩到刚好装下、≥108);支撑行芯片同宽 ——— */
function railFitChips() {
  var rail = document.getElementById("rail");
  if (!rail) { return; }
  var mainRow = rail.querySelector(".rail-main") || rail;
  var all = rail.querySelectorAll(".node-chip");
  var mains = [], sats = [], i;
  for (i = 0; i < all.length; i++) { if (all[i].classList.contains("sat")) { sats.push(all[i]); } else { mains.push(all[i]); } }
  function natural(list) {
    var k, m = 0, sum = 0;
    for (k = 0; k < list.length; k++) { list[k].style.width = ""; }
    for (k = 0; k < list.length; k++) { var w = list[k].offsetWidth; sum += w; if (w > m) { m = w; } }
    return { max: m, sum: sum };
  }
  function extent(el) {
    var ch = el.children, first = null, last = null, k;
    for (k = 0; k < ch.length; k++) {
      if (ch[k].offsetWidth > 0 && String(ch[k].tagName).toLowerCase() !== "svg") { if (!first) { first = ch[k]; } last = ch[k]; }
    }
    return first ? (last.offsetLeft + last.offsetWidth - first.offsetLeft) : 0;
  }
  if (mains.length > 0) {
    var nm = natural(mains);
    var gaps = extent(mainRow) - nm.sum;
    var uw = Math.min(200, nm.max);
    var fit = (rail.clientWidth - gaps) / mains.length;
    if (uw > fit) { uw = Math.max(108, fit); }
    for (i = 0; i < mains.length; i++) { mains[i].style.width = Math.floor(uw) + "px"; }
  }
  if (sats.length > 0) {
    var ns = natural(sats);
    var sw = Math.min(200, ns.max);
    for (i = 0; i < sats.length; i++) { sats[i].style.width = sw + "px"; }
  }
}

/* ——— 流程带支撑行(语义层):S/A 芯片定位到其关联主线节点下方(一维簇放置),依赖线正交布线;无 #railSem 时只做芯片等宽 ——— */
function semDrawRail() {
  railFitChips();
  var wrap = document.getElementById("railSem");
  var svg = document.getElementById("railSvg");
  if (!wrap || !svg) { return; }
  var sat = wrap.querySelector(".rail-sat");
  var mainRow = wrap.querySelector(".rail-main");
  var i, j;
  function rect(el) {
    var wr = wrap.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    return { l: r.left - wr.left, t: r.top - wr.top, w: r.width, h: r.height };
  }
  function mainChip(id) { return wrap.querySelector('.rail-main .node-chip[data-node="' + id + '"]'); }
  function satChip(id) { return wrap.querySelector('.rail-sat .node-chip[data-node="' + id + '"]'); }
  var nLinks = 0;
  for (i = 0; i < RAIL_LINKS.length; i++) { if (mainChip(RAIL_LINKS[i].to) && satChip(RAIL_LINKS[i].from)) { nLinks++; } }
  if (sat && mainRow) {
    wrap.style.rowGap = Math.max(30, 18 + 10 * nLinks) + "px";
    var gutter = 160;
    if (window.getComputedStyle) {
      var gw = parseFloat(window.getComputedStyle(sat, "::before").width);
      if (!isNaN(gw) && gw > 0) { gutter = gw + 18; }
    }
    var chips = sat.querySelectorAll(".node-chip");
    var items = [], maxH = 0;
    for (i = 0; i < chips.length; i++) {
      var ch = chips[i];
      ch.style.height = "";
      var nid = ch.getAttribute("data-node"), sum = 0, cnt = 0;
      for (j = 0; j < RAIL_LINKS.length; j++) {
        if (RAIL_LINKS[j].from !== nid) { continue; }
        var tg = mainChip(RAIL_LINKS[j].to);
        if (tg) { var tr = rect(tg); sum += tr.l + tr.w / 2; cnt++; }
      }
      items.push({ el: ch, want: cnt > 0 ? sum / cnt - ch.offsetWidth / 2 : gutter, w: ch.offsetWidth });
      if (ch.offsetHeight > maxH) { maxH = ch.offsetHeight; }
    }
    semPlace1D(items, gutter, 12);
    for (i = 0; i < items.length; i++) { items[i].el.style.left = Math.round(items[i].left) + "px"; items[i].el.style.height = maxH + "px"; }
    sat.style.height = maxH + "px";
  }
  var W = wrap.scrollWidth, H = wrap.scrollHeight;
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  var parts = ['<defs><marker id="rl-md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk-d"></path></marker></defs>'];
  if (sat && mainRow) {
    var links = [];
    for (i = 0; i < RAIL_LINKS.length; i++) {
      var a = satChip(RAIL_LINKS[i].from);
      var b = mainChip(RAIL_LINKS[i].to);
      if (!a || !b) { continue; }
      links.push({ rowBox: rect(b), satBox: rect(a), rowKey: RAIL_LINKS[i].to, satKey: RAIL_LINKS[i].from, dir: "up" });
    }
    var mr = rect(mainRow), sr = rect(sat);
    var routed = semRouteLane(links, mr.t + mr.h, sr.t);
    for (i = 0; i < routed.length; i++) {
      parts.push('<path d="' + routed[i].d + '" class="rl-d sfe" data-efrom="rail:' + routed[i].satKey + '" data-eto="rail:' + routed[i].rowKey + '" marker-end="url(#rl-md)"></path>');
    }
  }
  svg.innerHTML = parts.join("");
  sfApplyFocus(wrap);
}
window.addEventListener("resize", function () { semDrawRail(); });
window.addEventListener("load", function () { semDrawRail(); redrawActiveSubflows(); });
setTimeout(function () { semDrawRail(); }, 250);
